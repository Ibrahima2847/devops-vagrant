---
- name: Rolling update de l'application todolist en production
  hosts: prod_env
  become: true
  gather_facts: true
  serial: 1

  vars:
    app_name: todolist
    app_user: admin
    app_dir: /opt/todolist
    venv_dir: /opt/todolist/.venv
    app_port: 8000

    repo_url: "https://github.com/gaeldb/to-do-list.git"
    repo_version: "{{ app_version | default('main') }}"

    wsgi_module: "todo.wsgi:application"
    settings_path: "{{ app_dir }}/todo/settings.py"

    lb_host: lb_prod
    lb_ip: "192.168.56.20"
    haproxy_socket: "/run/haproxy/admin.sock"
    haproxy_backend: "app_back"

  handlers:
    - name: Restart gunicorn
      ansible.builtin.systemd:
        name: "gunicorn-{{ app_name }}"
        state: restarted
        daemon_reload: true

  tasks:
    - name: Désactiver le serveur courant dans HAProxy
      ansible.builtin.shell: |
        echo "disable server {{ haproxy_backend }}/{{ haproxy_name }}" | socat stdio {{ haproxy_socket }}
      delegate_to: "{{ lb_host }}"
      changed_when: true

    - name: Pause courte après désactivation dans HAProxy
      ansible.builtin.pause:
        seconds: 3

    - name: Installer les dépendances système (apt)
      ansible.builtin.apt:
        name:
          - git
          - python3
          - python3-venv
          - python3-pip
        update_cache: true

    - name: Créer le répertoire de l'application
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Télécharger les sources depuis GitHub
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
        update: true
        force: true
      become_user: "{{ app_user }}"

    - name: Configurer DEBUG dans settings.py
      ansible.builtin.lineinfile:
        path: "{{ settings_path }}"
        regexp: '^DEBUG\s*='
        line: "DEBUG = {{ debug_mode | default(false) }}"
        backup: true
      notify: Restart gunicorn

    - name: Créer l'environnement virtuel Python
      ansible.builtin.command: "python3 -m venv {{ venv_dir }}"
      args:
        creates: "{{ venv_dir }}/bin/activate"
      become_user: "{{ app_user }}"

    - name: Mettre à jour pip dans le venv
      ansible.builtin.pip:
        name: pip
        state: latest
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: "python3 -m venv"
      become_user: "{{ app_user }}"

    - name: Chercher un requirements.txt dans le projet
      ansible.builtin.find:
        paths: "{{ app_dir }}"
        patterns: "requirements.txt"
        recurse: true
      register: req_files

    - name: Installer les dépendances Python via requirements.txt
      ansible.builtin.pip:
        requirements: "{{ req_files.files[0].path }}"
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"
      when: req_files.matched | int > 0

    - name: Installer Django et Gunicorn si pas de requirements.txt
      ansible.builtin.pip:
        name:
          - django
          - gunicorn
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"
      when: req_files.matched | int == 0

    - name: Configurer ALLOWED_HOSTS
      ansible.builtin.lineinfile:
        path: "{{ settings_path }}"
        regexp: '^ALLOWED_HOSTS\s*='
        line: 'ALLOWED_HOSTS = ["{{ ansible_host }}", "{{ lb_ip }}", "localhost", "127.0.0.1"]'
        backup: true
      notify: Restart gunicorn

    - name: Lancer les migrations SQLite
      ansible.builtin.command: "{{ venv_dir }}/bin/python manage.py migrate"
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Déployer le service systemd Gunicorn
      ansible.builtin.template:
        src: "templates/gunicorn.service.j2"
        dest: "/etc/systemd/system/gunicorn-{{ app_name }}.service"
        mode: "0644"
      notify: Restart gunicorn

    - name: Activer et démarrer Gunicorn
      ansible.builtin.systemd:
        name: "gunicorn-{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Appliquer les changements immédiatement
      ansible.builtin.meta: flush_handlers

    - name: Attendre que l'application réponde sur le port HTTP local
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ app_port }}"
        timeout: 60

    - name: Tester la santé de l'application sur la VM mise à jour
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port }}/"
        method: GET
        return_content: false
        status_code: [200, 301, 302]
      register: http_check

    - name: Afficher le status HTTP obtenu
      ansible.builtin.debug:
        msg: "Serveur {{ inventory_hostname }} OK - HTTP {{ http_check.status }} sur http://{{ ansible_host }}:{{ app_port }}/"

    - name: Réactiver le serveur courant dans HAProxy
      ansible.builtin.shell: |
        echo "enable server {{ haproxy_backend }}/{{ haproxy_name }}" | socat stdio {{ haproxy_socket }}
      delegate_to: "{{ lb_host }}"
      changed_when: true

    - name: Pause courte après réactivation dans HAProxy
      ansible.builtin.pause:
        seconds: 3

    - name: Vérifier que le serveur est de nouveau joignable via le load balancer
      ansible.builtin.uri:
        url: "http://{{ lb_ip }}/"
        method: GET
        return_content: false
        status_code: [200, 301, 302]
      delegate_to: localhost
      register: lb_check

    - name: Afficher le résultat du test via le load balancer
      ansible.builtin.debug:
        msg: "Load balancer OK après réintégration de {{ inventory_hostname }} - HTTP {{ lb_check.status }}"